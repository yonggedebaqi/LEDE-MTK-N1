name: build openwrt_ipq60xx-6.1

on:
  workflow_dispatch:
    inputs:
      rep_url:
        description: '仓库地址'     
        required: true
        default: 'https://github.com/breeze303/openwrt-6.x.git'
      branch_name:
        description: '分支'     
        required: true
        default: 'ipq60xx-6.1'
        type: choice
        options:
        - main
      config_file:
        description: '配置文件'     
        required: true
        default: 'ax1800_config' 
        type: choice
        options:
        - ax1800_config

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: update
      run: |
        sudo apt update
        sudo apt install build-essential libncurses5-dev gawk git libssl-dev gettext zlib1g-dev swig unzip time rsync python3 python3-setuptools python3-yaml -y
        
        sudo apt autoclean
        sudo apt autoremove --purge
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
    - name: make 
      run: |
        CRTDIR=$(pwd)
        git clone -b ${{ inputs.branch_name }} ${{ inputs.rep_url }} ~/openwrt
        cd ~/openwrt
        ./scripts/feeds update -a && ./scripts/feeds install -a
        cd package && git clone https://github.com/fw876/helloworld
        cp -rf $CRTDIR/${{ inputs.config_file }} ~/openwrt/.config
        rm openwrt/package/kernel/mac80211/files/lib/wifi/mac80211.sh
        rm openwrt/package/base-files/files/etc/profile
        rm openwrt/package/base-files/files/etc/shadow
        rm -rf openwrt/feeds/packages/multimedia/ffmpeg
        cp ./mac80211.sh openwrt/package/kernel/mac80211/files/lib/wifi
        cp ./profile openwrt/package/base-files/files/etc
        cp ./shadow openwrt/package/base-files/files/etc
        cp -R ./libx265  openwrt/package/libs/
        cp -R ./ffmpeg openwrt/feeds/packages/multimedia/ffmpeg
        rm openwrt/feeds/packages/multimedia/ffmpeg/Makefile
        cp ./405_ffmpeg openwrt/feeds/packages/multimedia/ffmpeg/Makefile
        sed -i 's/bootstrap/material/g' openwrt/feeds/luci/collections/luci/Makefile
        sed -i 's# (default)##g' openwrt/feeds/luci/themes/luci-theme-bootstrap/Makefile
        sed -i 's#Material Theme#Material Theme (default)#g' openwrt/feeds/luci/themes/luci-theme-material/Makefile
        #sed -i 's#PKG_VERSION:=4.4#PKG_VERSION:=4.0#g' openwrt/feeds/packages/multimedia/ffmpeg/Makefile
        #sed -i 's#06b10a183ce5371f915c6bb15b7b1fffbe046e8275099c96affc29e17645d909#ed945daf40b124e77a685893cc025d086f638bc703183460aff49508edb3a43f#g' openwrt/feeds/packages/multimedia/ffmpeg/Makefile
        sed -i 's#Bootstrap Theme (default)#Bootstrap#g' openwrt/feeds/luci.index
        sed -i 's#Material Theme#Material Theme (default)#g' openwrt/feeds/luci.index
        sed -i 's#bootstrap#material#g' openwrt/feeds/luci/modules/luci-base/root/etc/config/luci
        sed -i 's#+luci-theme-bootstrap#+luci-theme-material#g' openwrt/feeds/luci.index
        sed -i 's#Bootstrap#Material#g' ./openwrt/feeds/luci/collections/luci-nginx/Makefile
        sed -i 's#bootstrap#material#g' ./openwrt/feeds/luci/collections/luci-nginx/Makefile
        sed -i 's#bootstrap#material#g' ./openwrt/feeds/luci/collections/luci-ssl-nginx/Makefile
        sed -i 's/Bootstrap/Material/g' ./openwrt/feeds/luci/collections/luci/Makefile
        make defconfig
        make -j$(expr $(nproc) + 1) V=s

    - name: Organize files
      id: organize
      if: true && !failure() && !cancelled()
      run: |
        cd ~/openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT 
    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled() && !failure()
      with:
        name: OpenWrt_firmware
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: true && !failure() && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        echo "status=success" >> $GITHUB_OUTPUT 
    - name: Upload firmware to release
      uses: softprops/action-gh-release@v1
      if: steps.tag.outputs.status == 'success' && !cancelled() && !failure()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        files: ${{ env.FIRMWARE }}/*
