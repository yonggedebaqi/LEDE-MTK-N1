name: R3G

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  OPNAME: 'ax1800'
  REPO_URL: https://github.com/yonggedebaqi/lede_ax1800 openwrt
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: ax1800.config
  SYS_CONF_SH: configure.sh
  PACKS: package.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL git.io/depends-ubuntu-2004)
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $SYS_CONF_SH
        cd openwrt
        $GITHUB_WORKSPACE/$SYS_CONF_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Install SSRPRO
      run: cd openwrt && git clone https://github.com/fw876/helloworld

    - name: delete file
      run: |
        rm openwrt/package/kernel/mac80211/files/lib/wifi/mac80211.sh
        rm openwrt/package/base-files/files/etc/profile
        rm openwrt/package/base-files/files/etc/shadow
        rm -rf openwrt/package/network/utils/curl
        rm -rf openwrt/feeds/packages/net/wget/
        rm -rf openwrt/feeds/packages/multimedia/ffmpeg
        rm openwrt/feeds/packages/multimedia/youtube-dl/Makefile
        rm -rf openwrt/feeds/packages/net/zerotier

    - name: copy move file
      run: |
        cp ./mac80211.sh openwrt/package/kernel/mac80211/files/lib/wifi
        cp ./profile openwrt/package/base-files/files/etc
        cp ./shadow openwrt/package/base-files/files/etc
        cp -R ./curl openwrt/package/network/utils/
        cp ./wget openwrt/feeds/packages/net/
        #cp -R ./oscam openwrt/package/lean/
        cp -R ./zerotier openwrt/feeds/packages/net/
        cp -R ./openwrt/helloworld/luci-app-ssr-plus openwrt/package/lean/
        cp -R ./openwrt/helloworld/naiveproxy openwrt/package/lean/
        cp -R ./openwrt/helloworld/shadowsocksr-libev openwrt/package/lean/
        cp -R ./openwrt/helloworld/shadowsocks-rust openwrt/package/lean/
        cp -R ./openwrt/helloworld/simple-obfs openwrt/package/lean/
        cp -R ./openwrt/helloworld/tcping openwrt/package/lean/
        cp -R ./openwrt/helloworld/trojan openwrt/package/lean/
        cp -R ./openwrt/helloworld/v2ray-core openwrt/package/lean/
        cp -R ./openwrt/helloworld/v2ray-plugin openwrt/package/lean/
        cp -R ./openwrt/helloworld/xray-core openwrt/package/lean/
        cp -R ./openwrt/helloworld/xray-plugin openwrt/package/lean/
        cp -R ./libx265  openwrt/package/libs/
        rm -rf ./openwrt/helloworld
        cp -R ./ffmpeg openwrt/feeds/packages/multimedia/ffmpeg
        rm openwrt/feeds/packages/multimedia/ffmpeg/Makefile
        cp ./405_ffmpeg openwrt/feeds/packages/multimedia/ffmpeg/Makefile
        cp ./youtube_Makefile openwrt/feeds/packages/multimedia/youtube-dl/Makefile
        sed -i 's/bootstrap/material/g' openwrt/feeds/luci/collections/luci/Makefile
        sed -i 's# (default)##g' openwrt/feeds/luci/themes/luci-theme-bootstrap/Makefile
        sed -i 's#Material Theme#Material Theme (default)#g' openwrt/feeds/luci/themes/luci-theme-material/Makefile
        #sed -i 's#PKG_VERSION:=4.4#PKG_VERSION:=4.0#g' openwrt/feeds/packages/multimedia/ffmpeg/Makefile
        #sed -i 's#06b10a183ce5371f915c6bb15b7b1fffbe046e8275099c96affc29e17645d909#ed945daf40b124e77a685893cc025d086f638bc703183460aff49508edb3a43f#g' openwrt/feeds/packages/multimedia/ffmpeg/Makefile
        sed -i 's#Bootstrap Theme (default)#Bootstrap#g' openwrt/feeds/luci.index
        sed -i 's#Material Theme#Material Theme (default)#g' openwrt/feeds/luci.index
        sed -i 's#bootstrap#material#g' openwrt/feeds/luci/modules/luci-base/root/etc/config/luci
        sed -i 's#+luci-theme-bootstrap#+luci-theme-material#g' openwrt/feeds/luci.index
        sed -i 's#Bootstrap#Material#g' ./openwrt/feeds/luci/collections/luci-nginx/Makefile
        sed -i 's#bootstrap#material#g' ./openwrt/feeds/luci/collections/luci-nginx/Makefile
        sed -i 's#bootstrap#material#g' ./openwrt/feeds/luci/collections/luci-ssl-nginx/Makefile
        sed -i 's/Bootstrap/Material/g' ./openwrt/feeds/luci/collections/luci/Makefile

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $PACKS
        cd openwrt
        $GITHUB_WORKSPACE/$PACKS

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j2 || make -j1 V=s
        echo "::set-output name=status::success"
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "::set-output name=status::success"

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "::set-output name=release_tag::$(date +"%Y.%m.%d-%H%M")"
        touch release.txt
        [ $UPLOAD_COWTRANSFER = true ] && echo "🔗 [Cowtransfer](${{ steps.cowtransfer.outputs.url }})" >> release.txt
        [ $UPLOAD_WETRANSFER = true ] && echo "🔗 [WeTransfer](${{ steps.wetransfer.outputs.url }})" >> release.txt
        echo "::set-output name=status::success"

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        name: ${{ env.OPNAME }}
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: GitRML/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 3
